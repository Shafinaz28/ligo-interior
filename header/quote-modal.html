<div class="quote-overlay" id="quote-modal" hidden>
    <div class="quote-card" role="dialog" aria-modal="true" aria-labelledby="quote-title">
        <button class="quote-close" type="button" data-quote-close aria-label="Close quote form">×</button>
        <h2 id="quote-title">Get A Free Quote</h2>
        <form id="quote-form">
            <div class="quote-grid">
                <label class="quote-field">Name
                    <span class="field-wrap">
                        <svg class="field-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="8" r="3.2" stroke="currentColor" stroke-width="1.8"/><path d="M5.5 19c1.2-3.2 3.4-4.8 6.5-4.8s5.3 1.6 6.5 4.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                        <input id="quote-name" name="name" type="text" required>
                    </span>
                </label>
                <label class="quote-field">Phone
                    <span class="field-wrap">
                        <svg class="field-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7.2 3.8h3.1l1.2 3.1-1.9 1.2a12.2 12.2 0 0 0 6.3 6.3l1.2-1.9 3.1 1.2v3.1c0 .8-.7 1.5-1.5 1.5C10.8 18.3 5.7 13.2 5.7 5.3c0-.8.7-1.5 1.5-1.5z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
                        <input id="quote-phone" name="phone" type="tel" required>
                    </span>
                </label>
                <label class="quote-field">Email
                    <span class="field-wrap">
                        <svg class="field-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="4" y="6" width="16" height="12" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="m5 8 7 5 7-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        <input id="quote-email" name="email" type="email" required>
                    </span>
                </label>
                <label class="quote-field">Service
                    <span class="field-wrap">
                        <svg class="field-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 9h16v10H4z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8 9V7.5A4 4 0 0 1 16 7.5V9" stroke="currentColor" stroke-width="1.8"/></svg>
                        <select id="quote-service" name="service" required>
                            <option value="" disabled selected>Select A Service</option>
                            <option value="Modular Kitchen Design">Modular Kitchen Design</option>
                            <option value="Full Home Interiors">Full Home Interiors</option>
                            <option value="Luxury Bedroom Design">Luxury Bedroom Design</option>
                            <option value="Home Renovation">Home Renovation</option>
                            <option value="Wardrobe Design">Wardrobe Design</option>
                            <option value="Turnkey Interiors">Turnkey Interiors</option>
                            <option value="Decor And Furniture">Decor And Furniture</option>
                        </select>
                    </span>
                </label>
                <label class="quote-field quote-grid-full">Address
                    <span class="field-wrap field-wrap-top">
                        <svg class="field-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 21s-6.2-6-6.2-10.2A6.2 6.2 0 0 1 12 4.6a6.2 6.2 0 0 1 6.2 6.2C18.2 15 12 21 12 21z" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="10.8" r="2" stroke="currentColor" stroke-width="1.8"/></svg>
                        <textarea id="quote-address" name="address" required></textarea>
                    </span>
                </label>
            </div>
            <button class="quote-submit" type="submit">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 12h14M13 6l7 6-7 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                Get A Quote
            </button>
        </form>
    </div>
</div>
