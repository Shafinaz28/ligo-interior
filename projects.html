<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects — Ligo Interiors</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @theme {
            --color-paper: #fcfaf6;
            --color-ink: #1c1917;
            --color-muted: #6b635c;
            --color-accent: #e0aa3e;
            --font-sans: "DM Sans", ui-sans-serif, system-ui, sans-serif;
            --breakpoint-nav: 860px;
        }
    </style>
    <style>
        html { scroll-behavior: smooth; }
    </style>
    <link rel="stylesheet" href="css/site.css">
</head>
<body class="m-0 flex min-h-screen flex-col bg-paper font-sans text-ink">
    <div id="site-header"></div>

    <main class="w-full flex-1">
        <section class="relative w-full min-h-[42vh] overflow-hidden bg-ink text-paper">
            <img class="absolute inset-0 h-full w-full object-cover" src="images/projects/PUNIT/DSC01226.avif" alt="A bright sitting room from a Ligo project">
            <div class="absolute inset-0 bg-[linear-gradient(to_bottom,rgba(28,25,23,0.28),rgba(28,25,23,0.48))]"></div>
            <div class="relative mx-auto flex min-h-[42vh] w-[min(1180px,calc(100%-40px))] flex-col items-center justify-center py-12 text-center">
                <p class="text-xs tracking-[0.2em] text-accent uppercase">Projects</p>
                <h1 class="mt-3 text-4xl leading-[1.08] font-semibold nav:text-5xl">Homes we have finished.</h1>
            </div>
        </section>

        <section class="py-16" id="clients">
            <div class="mx-auto w-[min(1180px,calc(100%-32px))]">
                <div class="text-center">
                    <h2 class="text-4xl leading-tight font-semibold">Client projects</h2>
                </div>
                <div class="mt-10 grid gap-5 sm:grid-cols-2 lg:grid-cols-3" id="client-grid"></div>
            </div>
        </section>

        <section class="px-4 pb-16">
            <div class="mx-auto flex w-[min(1180px,100%)] flex-col items-start justify-between gap-6 rounded-[32px] bg-ink px-6 py-12 text-paper nav:flex-row nav:items-center nav:px-12">
                <div>
                    <h2 class="text-3xl font-semibold">Want this level of finish in your house?</h2>
                    <p class="mt-3 max-w-[42ch] text-paper/70">Share a few notes and we will follow up with a range and a date to walk the scheme.</p>
                </div>
                <a class="rounded-full bg-accent px-6 py-3 text-sm font-medium text-ink" href="contact.html">Get a Quote</a>
            </div>
        </section>
    </main>

    <div id="project-lightbox" class="project-lightbox">
        <button class="lightbox-close" id="lightbox-close" type="button" aria-label="Close gallery">×</button>
        <p class="lightbox-kicker" id="lightbox-title">Project</p>
        <button class="lightbox-nav lightbox-prev" id="lightbox-prev" type="button" aria-label="Previous photo">←</button>
        <img id="lightbox-image" alt="">
        <button class="lightbox-nav lightbox-next" id="lightbox-next" type="button" aria-label="Next photo">→</button>
        <div class="lightbox-thumbs" id="lightbox-thumbs"></div>
    </div>

    <div id="site-footer"></div>
    <script src="js/include.js"></script>
    <script src="js/projects-data.js"></script>
    <script src="js/projects.js"></script>
</body>
</html>
